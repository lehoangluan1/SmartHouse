spring.application.name=smarthouse
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smarthouse}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

app.jwt.secret=${APP_JWT_SECRET:local-dev-secret-please-change-32-bytes}
app.jwt.expiration-minutes=720

app.security.refresh-token.ttl-days=30
app.security.refresh-token.max-active-per-user=10
app.security.refresh-token.cleanup-cron=0 0 3 * * *
app.security.refresh-token.rotate-on-refresh=true

app.offline-threshold-seconds=${APP_OFFLINE_THRESHOLD_SECONDS:120}
app.scheduler.zone=${APP_SCHEDULER_ZONE:Asia/Ho_Chi_Minh}

app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}
# & "C:\Program Files\RabbitMQ Server\rabbitmq_server-4.2.5\sbin\rabbitmq-plugins.bat" enable rabbitmq_management

app.messaging.user.queue=${APP_MESSAGING_USER_QUEUE:user.notification.queue}
app.messaging.user.exchange=${APP_MESSAGING_USER_EXCHANGE:user.notification.exchange}
app.messaging.user.routing-key=${APP_MESSAGING_USER_ROUTING_KEY:user.notification.routing-key}

app.outbox.publisher.fixed-delay-ms=${APP_OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}
app.outbox.publisher.batch-size=${APP_OUTBOX_PUBLISHER_BATCH_SIZE:50}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

app.notification.mail.enabled=${APP_NOTIFICATION_MAIL_ENABLED:false}
app.notification.mail.from=${APP_NOTIFICATION_MAIL_FROM:local@smarthouse.local}
app.notification.mail.admin-to=${APP_NOTIFICATION_MAIL_ADMIN_TO:}

logging.level.org.springframework.mail=${MAIL_LOG_LEVEL:WARN}
logging.level.org.eclipse.angus.mail=${MAIL_LOG_LEVEL:WARN}
logging.level.org.eclipse.angus.mail.smtp=${MAIL_LOG_LEVEL:WARN}

# logging.level.org.springframework.amqp=DEBUG
# logging.level.org.springframework.amqp.rabbit=DEBUG
# logging.level.org.springframework.amqp.rabbit.core.RabbitTemplate=DEBUG
# logging.level.org.springframework.amqp.rabbit.listener=INFO

app.telegram.enabled=${APP_TELEGRAM_ENABLED:false}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.chat-id=${TELEGRAM_CHAT_ID:}
